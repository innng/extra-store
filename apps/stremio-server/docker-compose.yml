version: "3.8"

services:
  stremio-server:
    image: stremio/server:v4.22.5
    restart: unless-stopped
    ports:
      - ${APP_PORT}:11470
    volumes:
      - ${APP_DATA_DIR}/data:/root/.stremio-server
    x-runtipi:
      internal_port: 11470
      is_main: true
    networks:
      - tipi_main_network
    labels:
      traefik.enable: true
      traefik.http.middlewares.stremio-server-web-redirect.redirectscheme.scheme: https
      traefik.http.services.stremio-server.loadbalancer.server.port: 11470
      traefik.http.routers.stremio-server-insecure.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.stremio-server-insecure.entrypoints: web
      traefik.http.routers.stremio-server-insecure.service: stremio-server
      traefik.http.routers.stremio-server-insecure.middlewares: stremio-server-web-redirect
      traefik.http.routers.stremio-server.rule: Host(`${APP_DOMAIN}`)
      traefik.http.routers.stremio-server.entrypoints: websecure
      traefik.http.routers.stremio-server.service: stremio-server
      traefik.http.routers.stremio-server.tls.certresolver: myresolver
      runtipi.managed: true

networks:
  tipi_main_network:
    external: true

x-runtipi:
  schema_version: 2
